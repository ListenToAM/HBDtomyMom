<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- เปิดเต็มจอเมื่อ Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ของแม่">
    <meta name="theme-color" content="#8c8c8c">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">
    <title>พื้นที่ของแม่ ❤️</title>

    <style>
        @font-face {
            font-family: 'FCVision';
            src: url('FCVision.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            font-family: 'FCVision', 'Thonburi', 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
        }

        html, body { height: 100%; }

        body {
            background-color: #8c8c8c;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
        }

        .popup-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 100%;
            max-width: 380px;
            padding: 35px 25px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0.7);
            opacity: 0;
        }

        @keyframes popIn { to { transform: scale(1); opacity: 1; } }

        .icon-header {
            font-size: 42px;
            margin-bottom: 12px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .icon-header { animation: none; }
        }

        .date-label { font-size: 16px; color: #666; margin-bottom: 8px; }

        .msg-text {
            font-size: 24px;
            color: #2f3542;
            line-height: 1.5;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* รูปที่ลอยขึ้นมาจากด้านล่างตอนกดปิด */
        .floater {
            position: fixed;
            bottom: -200px;
            width: var(--s);
            aspect-ratio: 3 / 4;
            object-fit: cover;
            border: 3px solid #fff;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            animation: floatUp 3s cubic-bezier(0.25, 0.6, 0.45, 1) both;
        }

        @keyframes floatUp {
            0%   { opacity: 0; transform: translate(0, 0) rotate(var(--r0)) scale(0.5); }
            12%  { opacity: 1; }
            100% { opacity: 1; transform: translate(var(--sway), calc(-100vh - 420px)) rotate(var(--r1)) scale(1); }
        }

        .extra-note {
            font-size: 18px;
            color: #ff4757;
            margin-bottom: 15px;
            background: rgba(255, 71, 87, 0.1);
            padding: 8px 12px;
            border-radius: 12px;
            display: none;
        }

        .close-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 20px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
            transition: transform 0.2s, opacity 0.2s;
        }

        .close-btn:active { transform: scale(0.96); }

        .footer-credit { margin-top: 15px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <div class="popup-card">
        <div class="icon-header" id="cardIcon">💌</div>
        <div class="date-label" id="dateDisplay">วันที่ -</div>
        <div class="msg-text" id="msgDisplay">กำลังโหลดข้อความ...</div>
        <div class="extra-note" id="extraNote"></div>
        <button class="close-btn" onclick="closeApp()">ปิดหน้านี้</button>
    </div>

    <!-- ข้อความทั้งหมดอยู่ในไฟล์นี้ -->
    <script src="messages.js"></script>
    <script>
        const DEFAULT_ICON = "💌";

        // รูปที่จะลอยขึ้นตอนกดปิด (เพิ่มรูปใหม่ต่อท้ายได้เลย)
        // pos = ตำแหน่งครอปรูป เช่น "center 20%" ถ้าหน้าคนโดนตัด
        const PHOTOS = [
            { src: "photo1.jpg", pos: "center 20%" },
            { src: "photo2.jpg", pos: "center" }
        ];

        // ปล่อยรูปลอยขึ้นจากด้านล่าง พ้นจอแล้วลบทิ้งเอง
        function floatPhotos(count = 28) {
            const rand = (a, b) => a + Math.random() * (b - a);
            for (let i = 0; i < count; i++) {
                const photo = PHOTOS[Math.floor(Math.random() * PHOTOS.length)];
                const el = document.createElement("img");
                el.src = photo.src;
                el.className = "floater";
                el.style.objectPosition = photo.pos;
                el.style.left = rand(2, 75) + "%";
                el.style.animationDuration = rand(2.4, 4) + "s";
                el.style.animationDelay = rand(0, 1.4) + "s";
                el.style.setProperty("--s", rand(56, 110) + "px");
                el.style.setProperty("--sway", rand(-80, 80) + "px");
                el.style.setProperty("--r0", rand(-25, 25) + "deg");
                el.style.setProperty("--r1", rand(-25, 25) + "deg");
                el.addEventListener("animationend", () => el.remove());
                document.body.appendChild(el);
            }
        }

        function pad(n) { return String(n).padStart(2, "0"); }

        // เลือกข้อความตามวันที่ (ไม่พึ่ง localStorage เลย)
        function pickMessage(now) {
            const mmdd = pad(now.getMonth() + 1) + "-" + pad(now.getDate());

            if (MESSAGES.birthday && MESSAGES.birthday.date === mmdd) {
                return { icon: MESSAGES.birthday.icon || "🎂", text: MESSAGES.birthday.text };
            }
            if (MESSAGES.special[mmdd]) {
                const s = MESSAGES.special[mmdd];
                return { icon: s.icon || DEFAULT_ICON, text: s.text };
            }
            if (MESSAGES.dated[mmdd]) {
                return { icon: DEFAULT_ICON, text: MESSAGES.dated[mmdd] };
            }

            // วันที่ลำดับที่เท่าไรของปี (1-366) คำนวณแบบไม่ติดปัญหา timezone/DST
            const dayOfYear = Math.round(
                (Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) -
                 Date.UTC(now.getFullYear(), 0, 0)) / 86400000
            );
            const pool = MESSAGES.pool;
            return { icon: DEFAULT_ICON, text: pool[(dayOfYear - 1) % pool.length] };
        }

        // อ่าน/เขียน localStorage แบบกันพัง (ถ้า iOS ล้างข้อมูล แอปก็ยังใช้ได้)
        function loadState() {
            try { return JSON.parse(localStorage.getItem("mom_app_v2")) || {}; }
            catch (e) { return {}; }
        }
        function saveState(s) {
            try { localStorage.setItem("mom_app_v2", JSON.stringify(s)); } catch (e) {}
        }

        function initApp() {
            const now = new Date();
            const todayKey = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());

            document.getElementById("dateDisplay").innerText = now.toLocaleDateString("th-TH", {
                year: "numeric", month: "long", day: "numeric", weekday: "long"
            });

            // โหลดรูปรอไว้ก่อน จะได้ขึ้นทันทีตอนกดปิด
            PHOTOS.forEach((p) => { new Image().src = p.src; });

            const msg = pickMessage(now);
            document.getElementById("cardIcon").innerText = msg.icon;
            document.getElementById("msgDisplay").innerText = msg.text;

            // นับจำนวนครั้งที่เปิดในวันเดียวกัน
            let state = loadState();
            state.count = (state.date === todayKey) ? (state.count || 0) + 1 : 1;
            state.date = todayKey;
            saveState(state);

            if (state.count > 1) {
                const note = document.getElementById("extraNote");
                note.style.display = "block";
                note.innerText = `กดเข้ามาดูรอบที่ ${state.count} แล้วนะ... คิดถึงลูกหรอ 😉`;
            }
        }

        function closeApp() {
            floatPhotos();

            const card = document.querySelector(".popup-card");
            card.style.transition = "transform 0.4s ease, opacity 0.4s ease";
            card.style.transform = "scale(0.5)";
            card.style.opacity = "0";

            setTimeout(() => {
                document.getElementById("msgDisplay").innerText = "ขอให้วันนี้มีความสุขมากๆ นะแม่ ไว้พรุ่งนี้มาเปิดอ่านใหม่ ❤️";
                document.getElementById("extraNote").style.display = "none";
                document.querySelector(".close-btn").style.display = "none";
                document.getElementById("cardIcon").innerText = "✨";

                card.style.transform = "scale(1)";
                card.style.opacity = "1";
            }, 400);
        }

        window.onload = initApp;

        // Service Worker: ให้เปิดได้แม้ไม่มีเน็ต และรับข้อความใหม่จาก GitHub อัตโนมัติ
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("service-worker.js").catch(() => {});
            });
        }
    </script>
</body>
</html>
